name: Android debug APK

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go_client/go.sum

      - name: Rebase Go modules (fix drifted go.sum)
        shell: bash
        run: |
          # Если go.sum в репозитории рассинхронизирован с импортами кода,
          # пересобираем его до сборки APK, чтобы gradlew не упал на missing go.sum entry
          set -euo pipefail
          if ! (cd go_client && go mod verify >/dev/null 2>&1 \
                && go list -deps -e ./... >/dev/null 2>&1); then
            echo "go.sum drift detected, running go mod tidy..."
            (cd go_client && go mod tidy)
          fi
          (cd go_client && go mod download)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PtargetAbis=arm64-v8a --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
